# DSH Console terminal application layered over the public dsh-base bundle.
- id: hmr
  disabled: true

# Keep startup lazy; DSH owns and rebuilds this derived search index.
# Config patches replace the whole row, so retain an explicit durable path.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('dsh-console-session-search.sqlite')
    openAt: first-search

# Official presets own these Agent-scoped tools and policies. Retaining the
# base's process-wide rows would expose them even in the minimal preset.
# Shared registries, persistence, and execution providers remain Host-owned.
- id: tool-plugin-manager
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

- insert:
    # Standard and Cordis presets sample this Host-owned setting when they
    # install delegation tools for a Session.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # The Cordis preset consumes the same public Host inspect services as the
    # official Web composition. Providers register once for all Sessions.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'

    # Console owns a per-Session Agent composition, including its scoped Skills.
    # dsh-base does not mount the preset roster, so the Console bundle must.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    - id: dsh-console-startup
      name: '@cofy-x/dsh-console/dsh/startup'

    - id: dsh-console-runner
      name: '@cofy-x/dsh-console/dsh'
      inject: [dshConsoleStartup]
      config:
        prompt: !!js ctx.dshConsoleStartup.prompt
        debug: !!js ctx.dshConsoleStartup.debug
        pokemon: !!js ctx.dshConsoleStartup.pokemon
        continueSession: !!js ctx.dshConsoleStartup.continueSession
        resumeSessionId: !!js ctx.dshConsoleStartup.resumeSessionId
