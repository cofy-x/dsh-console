name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build CLI
        run: pnpm run build:cli

      - name: Run workspace tests
        run: pnpm run test:ci

      - name: Test DSH composition
        run: pnpm run test:integration:dsh

      - name: Test packaged installation
        run: pnpm run test:package

  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build CLI
        run: pnpm run build:cli

      - name: Run workspace tests
        run: pnpm run test:ci

      - name: Test DSH composition
        run: pnpm run test:integration:dsh

      - name: Test packaged installation
        run: pnpm run test:package

  latest-dsh-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Console
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check out audited DSH release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/DeepSeek-Harness
          ref: 0a53fb55bea101816fa226bb964ae2bed71c343b
          path: _dsh-source
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install Console dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build audited DSH source release
        run: |
          pnpm --dir _dsh-source install --frozen-lockfile
          pnpm --dir _dsh-source run build

      - name: Select audited DSH source runtime
        run: node scripts/use-dsh-source.mjs _dsh-source

      - name: Verify Console against latest DSH source release
        run: |
          pnpm run typecheck
          pnpm run build:cli
          pnpm run test:ci
          pnpm run test:integration:dsh
